name: Update profile

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [toolbox.yaml, scripts/**]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/stats.py assets/stats.svg
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: python scripts/toolbox.py README.md toolbox.yaml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg README.md
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
