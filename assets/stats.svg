<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="GitHub all-time stats">
<style>
:root { --bg:#ffffff; --border:#d0d7de; --title:#0969da; --text:#1f2328; --muted:#656d76; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --border:#30363d; --title:#58a6ff; --text:#e6edf3; --muted:#8b949e; } }
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.title { font-size:18px; font-weight:600; fill:var(--title); }
.sub { font-size:12px; fill:var(--muted); }
.label { font-size:14px; fill:var(--text); }
.value { font-size:14px; font-weight:600; fill:var(--text); }
.lang { font-size:13px; fill:var(--text); }
.pct { fill:var(--muted); }
.head { font-size:12px; font-weight:600; fill:var(--muted); letter-spacing:.5px; }
</style>
<rect x=".5" y=".5" width="639" height="229" rx="8" fill="var(--bg)" stroke="var(--border)"/>
<text x="30" y="36" class="title">GitHub, all time</text>
<text x="610" y="36" class="sub" text-anchor="end">2016 – 2026 · private repositories included</text>
<text x="270" y="55" class="head">TOP LANGUAGES</text>
<clipPath id="r"><rect x="270" y="62" width="340" height="10" rx="5"/></clipPath>
<g clip-path="url(#r)"><rect x="270.0" y="62" width="234.3" height="10" fill="#3572A5"/><rect x="504.3" y="62" width="59.1" height="10" fill="#f34b7d"/><rect x="563.4" y="62" width="40.9" height="10" fill="#DA5B0B"/><rect x="604.3" y="62" width="2.9" height="10" fill="#7355dd"/><rect x="607.2" y="62" width="1.6" height="10" fill="#3178c6"/><rect x="608.8" y="62" width="1.2" height="10" fill="#e34c26"/></g>
<circle cx="275" cy="101" r="5" fill="#3572A5"/><text x="288" y="105" class="lang">Python <tspan class="pct">68.9%</tspan></text><circle cx="450" cy="101" r="5" fill="#f34b7d"/><text x="463" y="105" class="lang">C++ <tspan class="pct">17.4%</tspan></text><circle cx="275" cy="129" r="5" fill="#DA5B0B"/><text x="288" y="133" class="lang">Jupyter Notebook <tspan class="pct">12.0%</tspan></text><circle cx="450" cy="129" r="5" fill="#7355dd"/><text x="463" y="133" class="lang">C# <tspan class="pct">0.9%</tspan></text><circle cx="275" cy="157" r="5" fill="#3178c6"/><text x="288" y="161" class="lang">TypeScript <tspan class="pct">0.5%</tspan></text><circle cx="450" cy="157" r="5" fill="#e34c26"/><text x="463" y="161" class="lang">HTML <tspan class="pct">0.4%</tspan></text>
<text x="30" y="82" class="label">Commits</text><text x="200" y="82" class="value" text-anchor="end">1,908</text><text x="30" y="112" class="label">Pull requests</text><text x="200" y="112" class="value" text-anchor="end">25</text><text x="30" y="142" class="label">Code reviews</text><text x="200" y="142" class="value" text-anchor="end">1</text><text x="30" y="172" class="label">Issues</text><text x="200" y="172" class="value" text-anchor="end">5</text><text x="30" y="202" class="label">Repositories</text><text x="200" y="202" class="value" text-anchor="end">40</text>
</svg>
